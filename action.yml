name: Set up KiCad from the package store
description: >
  Installs one exact KiCad version on an Ubuntu runner from the .deb files stored as release assets of
  lfarrand/kicad-packages (key kicad-<version>-ubuntu<release>-<arch>). What the store does not hold is fetched
  from Launchpad's file store instead. The KiCad PPA's download server is never used.

inputs:
  version:
    description: The KiCad version, in full (for example 10.0.8)
    required: true
  packages:
    description: Packages to install, separated by spaces (for example "kicad kicad-demos")
    default: kicad
  repository:
    description: The repository whose releases hold the packages
    default: lfarrand/kicad-packages
  fallback:
    description: "'false' fails the job on a store miss instead of fetching from Launchpad"
    default: 'true'
  dependencies:
    description: "'false' leaves the stored copies of KiCad's Ubuntu dependencies unused: apt downloads them all"
    default: 'true'

outputs:
  cache-hit:
    description: "'true' every package came from the store, 'partial' some did, 'false' none did"
    value: ${{ steps.get.outputs.cache-hit }}
  key:
    description: The version key (the release tag), for example kicad-10.0.8-ubuntu24.04-amd64
    value: ${{ steps.get.outputs.key }}
  dependencies:
    description: How many of KiCad's Ubuntu dependencies were taken from the store (0 when none)
    value: ${{ steps.get.outputs.dependencies }}

runs:
  using: composite
  steps:
    - name: Fetch the KiCad packages
      id: get
      shell: bash
      # inputs reach the script through the environment, never by ${{ }} inside it
      env:
        KICAD_VERSION: ${{ inputs.version }}
        KICAD_PACKAGES: ${{ inputs.packages }}
        KICAD_STORE: ${{ inputs.repository }}
        KICAD_FALLBACK: ${{ inputs.fallback }}
        KICAD_DEPENDENCIES: ${{ inputs.dependencies }}
      run: |
        dest="${RUNNER_TEMP:-/tmp}/kicad-packages-$$"
        echo "KICAD_DEBS=$dest" >> "$GITHUB_ENV"
        echo "KICAD_DEPS=$dest-dependencies" >> "$GITHUB_ENV"
        set -- get --version "$KICAD_VERSION" --packages "$KICAD_PACKAGES" --repo "$KICAD_STORE" \
          --dest "$dest" --github-output "$GITHUB_OUTPUT"
        if [ "$KICAD_FALLBACK" = false ]; then set -- "$@" --no-fallback; fi
        if [ "$KICAD_DEPENDENCIES" != false ]; then set -- "$@" --dependencies-dest "$dest-dependencies"; fi
        python3 "$GITHUB_ACTION_PATH/tools/kicad_cache.py" "$@"
    - name: Install KiCad
      shell: bash
      # KiCad's dependencies (about 100 Ubuntu packages) are not the PPA's: apt resolves them. The copies the
      # store holds go into apt's download cache first; apt checks each against its own index and downloads only
      # what is missing or has changed since. A runner's Ubuntu mirror is sometimes so slow that this alone
      # outlasts a job, so that download is a step of its own with a time limit, tried again (apt keeps what it
      # already has); the install after it needs no network, and is never interrupted.
      run: |
        if [ "$(id -u)" = 0 ]; then SUDO=""; else SUDO=sudo; fi
        if compgen -G "$KICAD_DEPS/*.deb" > /dev/null; then
          $SUDO cp "$KICAD_DEPS"/*.deb /var/cache/apt/archives/
        fi
        apt_get() { $SUDO env DEBIAN_FRONTEND=noninteractive timeout --kill-after=30 "$1" apt-get \
          -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 "${@:2}"; }
        for attempt in 1 2 3 4; do
          if apt_get 180 update &&
             apt_get 300 install -y --no-install-recommends --download-only "$KICAD_DEBS"/*.deb; then
            $SUDO env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends "$KICAD_DEBS"/*.deb
            exit 0
          fi
          if [ "$attempt" -lt 4 ]; then
            echo "fetching KiCad's dependencies from Ubuntu's archive failed or took too long (attempt $attempt of 4), trying again in 30 s"
            sleep 30
          fi
        done
        echo "::error::KiCad's dependencies could not be fetched from Ubuntu's archive in 4 attempts"
        exit 1
    - name: The KiCad installed is the one asked for
      shell: bash
      env:
        KICAD_VERSION: ${{ inputs.version }}
        KICAD_PACKAGES: ${{ inputs.packages }}
      run: python3 "$GITHUB_ACTION_PATH/tools/kicad_cache.py" check --version "$KICAD_VERSION" --packages "$KICAD_PACKAGES"
