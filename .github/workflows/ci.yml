name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pytest==8.3.4 pytest-cov==6.0.0 pyyaml==6.0.2
      - name: Tests (coverage of tools/ must stay at 90 % or more)
        run: python -m pytest -q tests --cov=tools --cov-report=term-missing --cov-fail-under=90
  install:
    # The action itself, on a real runner: KiCad from the store (or from Launchpad while the store is empty),
    # then KiCad's own tools must run.
    name: Install KiCad with the action
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - id: kicad
        uses: ./
        with:
          version: "10.0.8"
          packages: kicad kicad-demos
      - name: KiCad runs
        env:
          HIT: ${{ steps.kicad.outputs.cache-hit }}
          KEY: ${{ steps.kicad.outputs.key }}
        run: |
          echo "store hit: $HIT ($KEY)" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$KEY" = kicad-10.0.8-ubuntu24.04-amd64
          kicad-cli version | tee -a "$GITHUB_STEP_SUMMARY"
          kicad-cli version | grep -q "^10\.0\.8"
          python3 -c "import pcbnew; print(pcbnew.Version())"
          test -d /usr/share/kicad/demos
